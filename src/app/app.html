<p-toast position="bottom-center" />
<p-confirmDialog />

<div class="app-container" [class.app-container--declaration]="hideFooter()">
  <header class="app-header">
    <div class="header-content">
      <div class="logo">
        <h1>{{ 'app.title' | translate }}</h1>
        <p class="tagline">{{ 'app.tagline' | translate }}</p>
      </div>
      <nav class="main-nav" [attr.aria-label]="'app.nav.mainAria' | translate">
        <app-language-switcher />
        <p-button
          [label]="'app.nav.circuit' | translate"
          [rounded]="true"
          size="small"
          [text]="!isDeclaration()"
          [severity]="isDeclaration() ? 'primary' : 'secondary'"
          (onClick)="goDeclaration()"
        />
        <p-button
          [label]="'app.nav.waypoints' | translate"
          [rounded]="true"
          size="small"
          [text]="!isWaypoints()"
          [severity]="isWaypoints() ? 'primary' : 'secondary'"
          (onClick)="goWaypoints()"
        />
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>&copy; {{ currentYear }} {{ 'app.footer' | translate }}</p>
  </footer>
</div>
