<p-toast position="bottom-center" />
<p-confirmDialog />

<div class="app-container" [class.app-container--declaration]="hideFooter()">
  <header class="app-header">
    <div class="header-content">
      <div class="logo">
        <h1>Glide Task Planner</h1>
        <p class="tagline">Composition et export de tâches planeur</p>
      </div>
      <nav class="main-nav" aria-label="Navigation principale">
        <p-button
          label="Circuit"
          [rounded]="true"
          size="small"
          [text]="!isDeclaration()"
          [severity]="isDeclaration() ? 'primary' : 'secondary'"
          (onClick)="goDeclaration()"
        />
        <p-button
          label="Waypoints"
          [rounded]="true"
          size="small"
          [text]="!isWaypoints()"
          [severity]="isWaypoints() ? 'primary' : 'secondary'"
          (onClick)="goWaypoints()"
        />
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>&copy; {{ currentYear }} Glide Task Planner</p>
  </footer>
</div>
