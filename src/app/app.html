<p-toast position="bottom-center" />
<p-confirmDialog />

<div class="app-container" [class.app-container--declaration]="hideFooter()">
  <header class="app-header">
    <div class="header-content">
      <div class="logo">
        <h1>VAV</h1>
        <p class="tagline">Déclaration de vol FLARM</p>
      </div>
      <nav class="main-nav" aria-label="Navigation principale">
        <p-button
          label="Déclaration"
          [rounded]="true"
          size="small"
          [text]="!isDeclaration()"
          [severity]="isDeclaration() ? 'primary' : 'secondary'"
          (onClick)="goDeclaration()"
        />
        <p-button
          label="Waypoints"
          [rounded]="true"
          size="small"
          [text]="!isWaypoints()"
          [severity]="isWaypoints() ? 'primary' : 'secondary'"
          (onClick)="goWaypoints()"
        />
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet />
  </main>

  <footer class="app-footer">
    <p>&copy; {{ currentYear }} VAV — Génération de flarmcfg.txt pour planeur</p>
    <p class="footer-links">
      <a href="https://sourceforge.net/projects/vav/" target="_blank" rel="noopener">
        Projet VAV d'origine
      </a>
    </p>
  </footer>
</div>
