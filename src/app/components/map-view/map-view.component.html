<div class="map-panel" [class.compact]="compact()">
  <div class="map-toolbar-wrap">
    <p-toolbar styleClass="map-toolbar">
      <ng-template #start>
        <div class="map-toolbar__group">
          <p-button
            label="Centrer tâche"
            icon="pi pi-crosshairs"
            size="small"
            severity="secondary"
            (onClick)="centerOnTask()"
          />
          <p-button
            icon="pi pi-ellipsis-v"
            size="small"
            severity="secondary"
            [text]="true"
            (onClick)="toolbarMenu.toggle($event)"
            ariaLabel="Plus d’actions carte"
          />
          <p-menu #toolbarMenu [popup]="true" [model]="toolbarMenuItems()" />
        </div>
      </ng-template>
      <ng-template #end>
        <div class="map-toolbar__controls">
          <p-button
            [label]="filtersExpanded() ? 'Filtres ▴' : 'Filtres ▾'"
            icon="pi pi-filter"
            size="small"
            [outlined]="!filtersExpanded()"
            severity="secondary"
            (onClick)="toggleFilters()"
            ariaLabel="Afficher les filtres de types"
          />
          <label class="map-airspace-switch" for="map-obs-zones-toggle">
            <span class="map-airspace-switch__label">Zones tâche</span>
            <p-toggleswitch
              inputId="map-obs-zones-toggle"
              [ngModel]="obsZonesVisible()"
              (ngModelChange)="onObsZonesToggle($event)"
              size="small"
              [disabled]="!mapReady() || circuitLegs().length === 0"
              [pTooltip]="circuitLegs().length === 0 ? 'Composez un circuit' : 'Cylindres / lignes / secteurs à l’échelle (m)'"
              tooltipPosition="bottom"
              ariaLabel="Afficher les zones d’observation"
            />
          </label>
          <label class="map-airspace-switch" for="map-airspace-toggle">
            <span class="map-airspace-switch__label">Espaces aériens</span>
            <p-toggleswitch
              inputId="map-airspace-toggle"
              [ngModel]="airspaceVisible()"
              (ngModelChange)="onAirspaceToggle($event)"
              size="small"
              [disabled]="airspaceLoading() || !mapReady()"
              [pTooltip]="airspaceLoading() ? 'Chargement…' : ''"
              tooltipPosition="bottom"
              ariaLabel="Afficher les espaces aériens"
            />
          </label>
          @if (airspaceConfigReady() && !airspaceLayerService.hasOpenAipKey()) {
            <p-select
              [options]="poaffRegions"
              optionLabel="label"
              optionValue="id"
              [ngModel]="airspaceRegionId()"
              (ngModelChange)="onAirspaceRegionChange($event)"
              [disabled]="airspaceLoading()"
              size="small"
              placeholder="Région"
              styleClass="map-region-select"
            />
          }
        </div>
      </ng-template>
    </p-toolbar>
    @if (airspaceStatus(); as status) {
      <p class="map-airspace-status">{{ status }}</p>
    }
  </div>

  @if (filtersExpanded()) {
    <div class="map-filters" role="group" aria-label="Afficher sur la carte">
      @for (filter of typeFilterOptions; track filter.type) {
        <label
          class="map-filter-switch"
          [class.map-filter-switch--off]="!isCatalogTypeVisible(filter.type)"
          [for]="'map-filter-' + filter.type"
          [style.--filter-color]="filter.color"
        >
          <i [class]="filter.icon" aria-hidden="true"></i>
          <span class="map-filter-switch__label">{{ filter.label }}</span>
          <p-toggleswitch
            [inputId]="'map-filter-' + filter.type"
            [ngModel]="isCatalogTypeVisible(filter.type)"
            (ngModelChange)="onCatalogTypeToggle(filter.type, $event)"
            size="small"
            [ariaLabel]="'Afficher ' + filter.label"
          />
        </label>
      }
    </div>
  }

  <div
    class="map-container"
    leaflet
    [leafletOptions]="mapOptions"
    (leafletMapReady)="onMapReady($event)"
    (leafletDoubleClick)="onMapDoubleClick($event)"
    (leafletMapZoomEnd)="onMapZoomEnd()"
  ></div>
</div>

<app-waypoint-edit-dialog
  [open]="editDialogOpen()"
  [waypoint]="editingWaypoint()"
  [isCreate]="editIsCreate()"
  (save)="onEditDialogSave($event)"
  (dismissed)="onEditDialogCancel()"
/>
