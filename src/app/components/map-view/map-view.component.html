<div class="map-panel" [class.compact]="compact()">
  <div class="map-toolbar">
    <button type="button" class="vav-btn vav-btn--secondary vav-btn--sm" (click)="centerOnTask()">Centrer tâche</button>
    <button type="button" class="vav-btn vav-btn--secondary vav-btn--sm" (click)="centerOnAll()">Tous les points</button>
    <button type="button" class="vav-btn vav-btn--ghost vav-btn--sm" (click)="clearSelection()">Effacer</button>
  </div>
  <div
    class="map-container"
    leaflet
    [leafletOptions]="mapOptions"
    (leafletMapReady)="onMapReady($event)"
    (leafletClick)="onMapClick($event)"
    (leafletMapMoveEnd)="onMapViewChanged()"
    (leafletMapZoomEnd)="onMapViewChanged()"
  ></div>
  <p class="map-hint">
    Fond satellite Esri · zoomez pour le catalogue (max. 350 pts) · clic : ajouter au circuit
  </p>
</div>
