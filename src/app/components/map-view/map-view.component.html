<div class="map-panel" [class.compact]="compact()">
  <div class="map-toolbar-wrap">
    <p-toolbar styleClass="map-toolbar">
      <ng-template #start>
        <div class="map-toolbar__group">
          <p-button
            [label]="'map.centerTask' | translate"
            icon="pi pi-crosshairs"
            size="small"
            severity="secondary"
            (onClick)="centerOnTask()"
          />
          <p-button
            icon="pi pi-ellipsis-v"
            size="small"
            severity="secondary"
            [text]="true"
            (onClick)="toolbarMenu.toggle($event)"
            [attr.aria-label]="'map.moreActions' | translate"
          />
          <p-menu #toolbarMenu [popup]="true" [model]="toolbarMenuItems()" />
        </div>
      </ng-template>
      <ng-template #end>
        <div class="map-toolbar__controls">
          <p-button
            [label]="(filtersExpanded() ? 'map.filtersExpanded' : 'map.filtersCollapsed') | translate"
            icon="pi pi-filter"
            size="small"
            [outlined]="!filtersExpanded()"
            severity="secondary"
            (onClick)="toggleFilters()"
            [attr.aria-label]="'map.filtersTypesAria' | translate"
          />
          <label class="map-airspace-switch" for="map-obs-zones-toggle">
            <span class="map-airspace-switch__label">{{ 'map.taskZones' | translate }}</span>
            <p-toggleswitch
              inputId="map-obs-zones-toggle"
              [ngModel]="obsZonesVisible()"
              (ngModelChange)="onObsZonesToggle($event)"
              size="small"
              [disabled]="!mapReady() || circuitLegs().length === 0"
              [pTooltip]="circuitLegs().length === 0 ? ('map.taskZonesTooltipEmpty' | translate) : ('map.taskZonesTooltip' | translate)"
              tooltipPosition="bottom"
              [attr.aria-label]="'map.taskZonesAria' | translate"
            />
          </label>
          <label class="map-airspace-switch" for="map-airspace-toggle">
            <span class="map-airspace-switch__label">{{ 'map.airspace' | translate }}</span>
            <p-toggleswitch
              inputId="map-airspace-toggle"
              [ngModel]="airspaceVisible()"
              (ngModelChange)="onAirspaceToggle($event)"
              size="small"
              [disabled]="airspaceLoading() || !mapReady()"
              [pTooltip]="airspaceLoading() ? ('common.loading' | translate) : ''"
              tooltipPosition="bottom"
              [attr.aria-label]="'map.airspaceAria' | translate"
            />
          </label>
          @if (airspaceConfigReady() && !airspaceLayerService.hasOpenAipKey()) {
            <p-select
              [options]="poaffRegions"
              optionLabel="label"
              optionValue="id"
              [ngModel]="airspaceRegionId()"
              (ngModelChange)="onAirspaceRegionChange($event)"
              [disabled]="airspaceLoading()"
              size="small"
              [placeholder]="'map.region' | translate"
              styleClass="map-region-select"
            />
          }
        </div>
      </ng-template>
    </p-toolbar>
    @if (airspaceStatus(); as status) {
      <p class="map-airspace-status">{{ status }}</p>
    }
  </div>

  @if (filtersExpanded()) {
    <div class="map-filters" role="group" [attr.aria-label]="'map.filtersAria' | translate">
      @for (filter of typeFilterOptions(); track filter.type) {
        <label
          class="map-filter-switch"
          [class.map-filter-switch--off]="!isCatalogTypeVisible(filter.type)"
          [for]="'map-filter-' + filter.type"
          [style.--filter-color]="filter.color"
        >
          <i [class]="filter.icon" aria-hidden="true"></i>
          <span class="map-filter-switch__label">{{ filter.label }}</span>
          <p-toggleswitch
            [inputId]="'map-filter-' + filter.type"
            [ngModel]="isCatalogTypeVisible(filter.type)"
            (ngModelChange)="onCatalogTypeToggle(filter.type, $event)"
            size="small"
            [attr.aria-label]="'map.showType' | translate: { label: filter.label }"
          />
        </label>
      }
    </div>
  }

  <div class="map-container">
    <mgl-map
      [mapStyle]="mapStyle"
      [center]="mapCenter()"
      [zoom]="mapZoom()"
      [doubleClickZoom]="false"
      (mapLoad)="onMapLoad($event)"
      (mapDblClick)="onMapDblClick($event)"
    />
    @if (contextMenu(); as ctx) {
      <div
        class="gc-map-ctx-anchor"
        [style.left.px]="ctx.x"
        [style.top.px]="ctx.y"
        (click)="$event.stopPropagation()"
      >
        <app-waypoint-context-menu
          [waypoint]="ctx.waypoint"
          [circuitLegs]="circuitLegs()"
          [typeLabel]="waypointTypeLabel(ctx.waypoint)"
          [canSetDeparture]="taskState.canSetDeparture(ctx.waypoint.id)"
          [canSetArrival]="taskState.canSetArrival(ctx.waypoint.id)"
          [labels]="contextPopupLabels()"
          [roleLabel]="circuitRoleLabel"
          (action)="onContextAction($event, ctx.waypoint)"
        />
      </div>
    }
  </div>
</div>

<app-waypoint-edit-dialog
  [open]="editDialogOpen()"
  [waypoint]="editingWaypoint()"
  [isCreate]="editIsCreate()"
  (save)="onEditDialogSave($event)"
  (dismissed)="onEditDialogCancel()"
/>
