<div class="map-panel" [class.compact]="compact()">
  <div class="map-toolbar">
    @if (taskDistanceKm(); as km) {
      <span class="map-task-distance" title="Distance tâche hors branches décollage / atterrissage">{{ km }}</span>
    }
    <button type="button" class="vav-btn vav-btn--secondary vav-btn--sm" (click)="centerOnTask()">Centrer tâche</button>
    <button type="button" class="vav-btn vav-btn--secondary vav-btn--sm" (click)="centerOnAll()">Tous les points</button>
    <button type="button" class="vav-btn vav-btn--ghost vav-btn--sm" (click)="clearSelection()">Effacer</button>
  </div>
  <div class="map-filters" role="group" aria-label="Afficher sur la carte">
    @for (filter of typeFilterOptions; track filter.type) {
      <button
        type="button"
        class="map-filter-chip"
        [class.map-filter-chip--off]="!isCatalogTypeVisible(filter.type)"
        [attr.aria-pressed]="isCatalogTypeVisible(filter.type)"
        [style.--chip-color]="filter.color"
        (click)="toggleCatalogTypeFilter(filter.type)"
      >
        <span class="map-filter-chip__dot" aria-hidden="true"></span>
        {{ filter.label }}
      </button>
    }
  </div>
  <div
    class="map-container"
    leaflet
    [leafletOptions]="mapOptions"
    (leafletMapReady)="onMapReady($event)"
    (leafletDoubleClick)="onMapDoubleClick($event)"
    (leafletMapZoomEnd)="onMapZoomEnd()"
  ></div>
  <p class="map-hint">
    Pastilles toujours visibles · noms au zoom ≥ 10 · clic : actions · double-clic : nouveau point
  </p>
</div>
