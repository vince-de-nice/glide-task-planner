<div class="library-page gc-page">
  <p class="gc-page-intro">{{ 'library.pageIntro' | translate }}</p>

  @if (circuitMessage()) {
    <p class="gc-alert gc-alert--success lib-page-msg">{{ circuitMessage() }}</p>
  }

  <section class="lib-page-status gc-card" [attr.aria-label]="'library.statusAria' | translate">
    <div class="lib-page-status__tags">
      <p-tag [value]="'library.savedCount' | translate: { count: circuitCount() }" severity="info" />
      @if (canSave()) {
        <p-tag
          [value]="'library.currentTaskReady' | translate: { count: circuitLegs().length }"
          severity="success"
        />
      } @else {
        <p-tag [value]="'library.currentTaskEmpty' | translate" />
      }
    </div>
  </section>

  <app-circuit-library
    [canSave]="canSave()"
    [embeddedPage]="true"
    (saveRequested)="onSaveRequested($event)"
    (circuitLoaded)="onCircuitLoaded($event)"
  />
</div>
