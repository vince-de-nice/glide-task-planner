<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [header]="'Zone & altitude — ' + wpName()"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [style]="{ width: 'min(100vw - 1rem, 480px)' }"
>
  <p class="leg-zone-dialog__meta">
    Point {{ legIndex() + 1 }} · {{ roleLabel() }}
  </p>

  <div class="leg-zone-dialog__field">
    <label for="zone-preset">Type de zone</label>
    <p-select
      inputId="zone-preset"
      [options]="presetOptions()"
      optionLabel="label"
      optionValue="id"
      [ngModel]="presetId()"
      (ngModelChange)="onPresetChange($event)"
      fluid
      size="small"
    />
    @if (presetOptions().find(p => p.id === presetId()); as opt) {
      <span class="leg-zone-dialog__hint">{{ opt.description }}</span>
    }
  </div>

  <div class="leg-zone-dialog__grid">
    <div class="leg-zone-dialog__field">
      <label for="zone-style">Style CUP</label>
      <p-select
        inputId="zone-style"
        [options]="cupStyleOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="cupStyle()"
        (ngModelChange)="cupStyle.set($event); presetId.set('custom')"
        fluid
        size="small"
      />
    </div>
    <div class="leg-zone-dialog__field">
      <label for="zone-r1">R1 (m)</label>
      <p-inputNumber
        inputId="zone-r1"
        [ngModel]="r1M()"
        (ngModelChange)="r1M.set(+$event); presetId.set('custom')"
        [min]="50"
        [max]="100000"
        size="small"
        fluid
      />
    </div>
    <div class="leg-zone-dialog__field">
      <label for="zone-a1">A1 (°)</label>
      <p-inputNumber
        inputId="zone-a1"
        [ngModel]="a1Deg()"
        (ngModelChange)="a1Deg.set($event); presetId.set('custom')"
        [min]="0"
        [max]="360"
        size="small"
        fluid
      />
    </div>
    <div class="leg-zone-dialog__field">
      <label for="zone-r2">R2 (m)</label>
      <p-inputNumber
        inputId="zone-r2"
        [ngModel]="r2M()"
        (ngModelChange)="r2M.set($event); presetId.set('custom')"
        [min]="0"
        [max]="100000"
        size="small"
        fluid
      />
    </div>
    <div class="leg-zone-dialog__field">
      <label for="zone-a2">A2 (°)</label>
      <p-inputNumber
        inputId="zone-a2"
        [ngModel]="a2Deg()"
        (ngModelChange)="a2Deg.set($event); presetId.set('custom')"
        [min]="0"
        [max]="360"
        size="small"
        fluid
      />
    </div>
    <div class="leg-zone-dialog__field">
      <label for="zone-a12">A12 (°)</label>
      <p-inputNumber
        inputId="zone-a12"
        [ngModel]="a12Deg()"
        (ngModelChange)="a12Deg.set($event); presetId.set('custom')"
        [min]="0"
        [max]="360"
        size="small"
        fluid
      />
    </div>
  </div>

  <div class="leg-zone-dialog__field leg-zone-dialog__field--row">
    <p-checkbox
      [ngModel]="line()"
      (ngModelChange)="line.set($event); presetId.set('custom')"
      [binary]="true"
      inputId="zone-line"
    />
    <label for="zone-line">Ligne (CUP Line=1)</label>
  </div>

  <p class="leg-zone-dialog__preview">Aperçu zone : <strong>{{ zonePreview() }}</strong></p>

  <hr class="leg-zone-dialog__sep" />

  <div class="leg-zone-dialog__field leg-zone-dialog__field--row">
    <p-checkbox
      [ngModel]="useCustomElevation()"
      (ngModelChange)="useCustomElevation.set($event)"
      [binary]="true"
      inputId="leg-elev-custom"
    />
    <label for="leg-elev-custom">Altitude tâche personnalisée (MSL)</label>
  </div>

  @if (useCustomElevation()) {
    <div class="leg-zone-dialog__field">
      <label for="leg-elev">Altitude (m MSL)</label>
      <p-inputNumber
        inputId="leg-elev"
        [ngModel]="elevationM()"
        (ngModelChange)="elevationM.set($event)"
        [min]="-500"
        [max]="9000"
        size="small"
        fluid
      />
    </div>
  } @else {
    <p class="leg-zone-dialog__hint">Altitude export : {{ effectiveElevation() }} (waypoint CUP)</p>
  }

  <div class="leg-zone-dialog__foot">
    <p-button label="Annuler" [outlined]="true" size="small" (onClick)="close()" />
    <p-button label="Enregistrer" icon="pi pi-check" size="small" (onClick)="onSave()" />
  </div>
</p-dialog>
