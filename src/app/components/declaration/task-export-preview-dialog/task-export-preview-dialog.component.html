<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [header]="'dialogs.exportPreview' | translate"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [draggable]="false"
  styleClass="decl-preview-dialog"
  [style]="{ width: 'min(100vw - 1rem, 640px)' }"
  [contentStyle]="{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }"
>
  <p class="decl-preview__reg">{{ regulationProfileLabel() }}</p>
  @if (ruleValidation().errors.length > 0) {
    <p-message severity="error">{{ ruleValidation().errors.join(' · ') }}</p-message>
  }
  <p-select
    [options]="previewFormatOptions()"
    optionLabel="label"
    optionValue="value"
    [ngModel]="previewFormat()"
    (ngModelChange)="previewFormat.set($event)"
    size="small"
    fluid
    [ariaLabel]="'preview.formatAria' | translate"
  />
  <p-button
    [label]="copyFeedback() ? ('common.copied' | translate) : ('common.copy' | translate)"
    icon="pi pi-copy"
    size="small"
    severity="secondary"
    (onClick)="copyPreview()"
    [disabled]="!exportPreview()"
  />
  <textarea pTextarea fluid pSize="small" readonly [value]="exportPreview()" rows="14"></textarea>
  <div class="decl-wp-dialog__foot decl-wp-dialog__foot--split">
    <p-button
      [label]="'common.download' | translate"
      icon="pi pi-download"
      (onClick)="requestDownload()"
      [disabled]="selectedWaypointIds().length === 0 || exportBlocked()"
    />
    <p-button [label]="'common.close' | translate" [outlined]="true" (onClick)="close()" />
  </div>
</p-dialog>
