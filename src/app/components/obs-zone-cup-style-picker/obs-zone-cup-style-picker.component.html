<section class="cup-style-picker" [attr.aria-label]="'zoneCup.cupStylePickerAria' | translate">
  <h4 class="cup-style-picker__title">{{ 'zoneCup.cupStyle' | translate }}</h4>
  <p class="cup-style-picker__lead">{{ 'zoneCup.cupStylePickerLead' | translate }}</p>

  <div class="cup-style-picker__grid" role="listbox">
    @for (tile of tiles(); track tile.value) {
      <button
        type="button"
        class="cup-style-picker__tile"
        role="option"
        [class.cup-style-picker__tile--active]="tile.selected"
        [attr.aria-selected]="tile.selected"
        (click)="onPick(tile.value)"
      >
        <span class="cup-style-picker__preview">
          <app-obs-zone-cup-diagram
            [zone]="tile.zone"
            [referenceBearingDeg]="tile.referenceBearingDeg"
            [legRole]="legContext()?.leg?.role ?? null"
            [compact]="true"
          />
        </span>
        <span class="cup-style-picker__label">{{ tile.label }}</span>
      </button>
    }
  </div>
</section>
